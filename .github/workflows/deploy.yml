name: Deploy

# Deploys the plugin directory ./o3po with rsync over ssh (password auth via sshpass).
#
# Triggers
#   - push of a tag v*            -> environment "production" (tag must be on master and
#                                    match the plugin header Version and readme Stable tag)
#   - PR labeled "deploy-dev"     -> environment "qjwp.cgogolin.de" (redeploys on every push
#                                    to the PR while the label is set; fork PRs are skipped)
#   - manual workflow_dispatch    -> environment "qjwp.cgogolin.de" (from the selected branch)
#
# One-time setup in GitHub (Settings -> Environments)
#   1. Create environments "qjwp.cgogolin.de" and, once dev is tested, "production".
#      For "production" restrict deployment tags to the pattern v*.
#   2. In EACH environment set:
#        variable FTP_URL          host and plugins directory of the target WordPress, no
#                                  user and no trailing o3po, e.g.
#                                  rb06.serverdomain.org/home/www/wordpress/wp-content/plugins/
#        secret   FTP_USER         ssh user name
#        secret   FTP_PASSWORD     ssh password
#        variable SSH_KNOWN_HOSTS  (optional) known_hosts line(s) of the host. If unset, the
#                                  host key is fetched with ssh-keyscan at deploy time.
#   3. Create the repository label "deploy-dev".
#
# Safety: rsync runs with --delete, so everything inside <FTP_URL>/o3po that is not in the
# repository is removed on the server (nothing outside o3po/ is touched). Guards: FTP_URL's
# path must end in /wp-content/plugins and exist, local o3po/ must be complete, at most 50
# deletions are allowed (--max-delete), and the manual run defaults to a dry run. Real
# production deploys are only allowed from a tag vX.Y.Z or vX.Y.Z-rc.N; manual dry runs may target either.
# The production environment's tag rule v*.*.* is fine; the workflow trigger is stricter.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: ['qjwp.cgogolin.de', 'production']
        default: 'qjwp.cgogolin.de'
      dry_run:
        description: Dry run (rsync -n, nothing is changed on the server)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'deploy-dev') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          tools: phpunit:9
      - run: sudo apt-get install -y libimage-exiftool-perl
      - run: make lint
      - run: make test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_type == 'tag' && 'production' || 'qjwp.cgogolin.de')) }}
    concurrency:
      group: deploy-${{ (github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_type == 'tag' && 'production' || 'qjwp.cgogolin.de')) }}
      cancel-in-progress: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_type == 'tag' && 'production' || 'qjwp.cgogolin.de')) != 'production' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse real production deploys that are not from a tag
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_type == 'tag' && 'production' || 'qjwp.cgogolin.de')) == 'production' && github.ref_type != 'tag' && inputs.dry_run != true }}
        run: |
          echo "::error::Real deploys to production are only allowed from a version tag (dry runs are fine)"
          exit 1

      - name: Check tag is on master and versions are consistent
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master \
            || { echo "::error::Tag is not on master"; exit 1; }
          header=$(sed -n 's/^ \* Version: *//p' o3po/o3po.php | tr -d '[:space:]')
          stable=$(sed -n 's/^\* Stable tag: *//p' readme.txt | tr -d '[:space:]')
          [ "$tag" = "$header" ] || { echo "::error::Tag $tag != plugin header version $header"; exit 1; }
          base="${tag%-rc.*}"  # release candidates: readme stable tag is the base version
          [ "$base" = "$stable" ] || { echo "::error::Tag $tag (base $base) != readme stable tag $stable"; exit 1; }

      - name: Deploy via rsync over ssh
        env:
          FTP_URL: ${{ vars.FTP_URL }}
          SSH_USER: ${{ secrets.FTP_USER }}
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
        run: |
          set -eu
          [ -n "$FTP_URL" ] && [ -n "$SSH_USER" ] && [ -n "$SSHPASS" ] \
            || { echo "::error::FTP_URL, FTP_USER and FTP_PASSWORD must be set"; exit 1; }
          url="${FTP_URL#*://}"
          host="${url%%/*}"
          path="/${url#*/}"
          path="${path%/}"
          # Safety checks: --delete only ever acts inside <path>/o3po, but make sure
          # that this is really the plugins directory of a WordPress installation.
          [[ "$host" =~ ^[A-Za-z0-9.-]+$ ]] \
            || { echo "::error::FTP_URL has no valid host"; exit 1; }
          [[ "$path" =~ ^/[A-Za-z0-9._/-]+/wp-content/plugins$ ]] && [[ "$path" != *..* ]] \
            || { echo "::error::FTP_URL path must be an absolute path ending in /wp-content/plugins"; exit 1; }
          [ -f o3po/o3po.php ] && [ "$(find o3po -type f | wc -l)" -ge 50 ] \
            || { echo "::error::Local o3po/ looks incomplete, refusing to --delete"; exit 1; }
          sudo apt-get install -y sshpass rsync
          mkdir -p ~/.ssh
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$host" > ~/.ssh/known_hosts
          fi
          ssh_cmd="ssh -ax -o StrictHostKeyChecking=yes"
          sshpass -e $ssh_cmd "$SSH_USER@$host" test -d "'$path'" \
            || { echo "::error::Remote directory $path does not exist"; exit 1; }
          opts="-avHz --delete --max-delete=50"
          if [ "$DRY_RUN" = true ]; then
            echo "DRY RUN: nothing will be changed on the server"
            opts="$opts -n --itemize-changes"
          fi
          sshpass -e rsync $opts -e "$ssh_cmd" ./o3po "$SSH_USER@$host:$path/"
